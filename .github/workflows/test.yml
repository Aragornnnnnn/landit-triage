# 코드가 바뀔 때 단위 테스트와 문법 검사를 돌린다
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: 문법 검사
        run: for f in scripts/*.mjs src/*.mjs; do node --check "$f"; done

      - name: 단위 테스트
        run: npm test
