<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <title>landit-triage 아키텍처</title>
  <desc>Sentry 새 이슈 웹훅이 landit-alerts를 거쳐 디스코드 카드로 바로 가고, landit-triage GitHub Actions가 자료 수집, 코드 체크아웃, Claude Code 분석을 거쳐 2~4분 뒤 카드에 스레드를 붙인다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5F5E5A"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="660" rx="20" fill="#FBFAF7"/>

  <text x="40" y="52" font-size="22" font-weight="600" fill="#2C2C2A">landit-triage 흐름</text>
  <text x="40" y="78" font-size="14" fill="#5F5E5A">Sentry 새 이슈 → 디스코드 카드는 바로, Claude Code 분석은 2~4분 뒤 카드의 스레드로</text>

  <!-- 바깥 서비스 줄 -->
  <g>
    <rect x="40" y="110" width="220" height="80" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
    <text x="150" y="145" font-size="17" font-weight="600" fill="#2C2C2A" text-anchor="middle">Sentry</text>
    <text x="150" y="168" font-size="13" fill="#5F5E5A" text-anchor="middle">새 이슈 알림 규칙</text>
  </g>
  <g>
    <rect x="340" y="110" width="240" height="80" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
    <text x="460" y="145" font-size="17" font-weight="600" fill="#2C2C2A" text-anchor="middle">landit-alerts</text>
    <text x="460" y="168" font-size="13" fill="#5F5E5A" text-anchor="middle">Vercel 함수 · 퍼블릭</text>
  </g>
  <g>
    <rect x="880" y="110" width="280" height="80" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
    <text x="1020" y="145" font-size="17" font-weight="600" fill="#2C2C2A" text-anchor="middle">Discord #sentry-*</text>
    <text x="1020" y="168" font-size="13" fill="#5F5E5A" text-anchor="middle">이슈 카드 · 분석 스레드</text>
  </g>

  <line x1="260" y1="150" x2="336" y2="150" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="298" y="140" font-size="12" fill="#5F5E5A" text-anchor="middle">웹훅</text>

  <line x1="580" y1="150" x2="876" y2="150" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="668" y="124" width="120" height="22" rx="11" fill="#F1EFE8"/>
  <text x="728" y="139" font-size="12" fill="#444441" text-anchor="middle">① 카드 · 바로</text>

  <!-- landit-alerts → landit-triage -->
  <line x1="460" y1="190" x2="460" y2="262" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="474" y="212" width="250" height="22" rx="11" fill="#F1EFE8"/>
  <text x="599" y="227" font-size="12" fill="#444441" text-anchor="middle">② repository_dispatch · 이슈 id, 카드 위치</text>

  <!-- landit-triage 컨테이너 -->
  <rect x="40" y="266" width="1120" height="290" rx="16" fill="#F3FAF7" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="64" y="298" font-size="16" font-weight="600" fill="#085041">landit-triage</text>
  <text x="180" y="298" font-size="13" fill="#0F6E56">GitHub Actions · 프라이빗 레포 · 새 이슈가 올 때만 실행</text>

  <!-- 단계 -->
  <g>
    <rect x="64" y="322" width="192" height="88" rx="12" fill="#FFFFFF" stroke="#5DCAA5"/>
    <text x="160" y="352" font-size="12" fill="#0F6E56" text-anchor="middle">1</text>
    <text x="160" y="374" font-size="15" font-weight="600" fill="#085041" text-anchor="middle">실행 판단</text>
    <text x="160" y="395" font-size="12" fill="#0F6E56" text-anchor="middle">하루 10건 · 중복 분석 막기</text>
  </g>
  <g>
    <rect x="280" y="322" width="192" height="88" rx="12" fill="#FFFFFF" stroke="#5DCAA5"/>
    <text x="376" y="352" font-size="12" fill="#0F6E56" text-anchor="middle">2</text>
    <text x="376" y="374" font-size="15" font-weight="600" fill="#085041" text-anchor="middle">Sentry 자료 수집</text>
    <text x="376" y="395" font-size="12" fill="#0F6E56" text-anchor="middle">이벤트 · 태그 · 앞뒤 2분</text>
  </g>
  <g>
    <rect x="496" y="322" width="192" height="88" rx="12" fill="#FFFFFF" stroke="#5DCAA5"/>
    <text x="592" y="352" font-size="12" fill="#0F6E56" text-anchor="middle">3</text>
    <text x="592" y="374" font-size="15" font-weight="600" fill="#085041" text-anchor="middle">코드 체크아웃</text>
    <text x="592" y="395" font-size="12" fill="#0F6E56" text-anchor="middle">landit-fe · be · ai</text>
  </g>
  <g>
    <rect x="712" y="322" width="192" height="88" rx="12" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
    <text x="808" y="352" font-size="12" fill="#993C1D" text-anchor="middle">4</text>
    <text x="808" y="374" font-size="15" font-weight="600" fill="#712B13" text-anchor="middle">Claude Code 분석</text>
    <text x="808" y="395" font-size="12" fill="#993C1D" text-anchor="middle">Opus 5.5 · 읽기 도구만</text>
  </g>
  <g>
    <rect x="928" y="322" width="208" height="88" rx="12" fill="#FFFFFF" stroke="#5DCAA5"/>
    <text x="1032" y="352" font-size="12" fill="#0F6E56" text-anchor="middle">5</text>
    <text x="1032" y="374" font-size="15" font-weight="600" fill="#085041" text-anchor="middle">스레드 게시</text>
    <text x="1032" y="395" font-size="12" fill="#0F6E56" text-anchor="middle">판정 · 원인 · 같이 볼 프롬프트</text>
  </g>

  <line x1="256" y1="366" x2="276" y2="366" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <line x1="472" y1="366" x2="492" y2="366" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <line x1="688" y1="366" x2="708" y2="366" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <line x1="904" y1="366" x2="924" y2="366" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- 스레드 게시 → Discord -->
  <path d="M1032 322 L1032 194" stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arrow-teal)"/>
  <rect x="1044" y="230" width="104" height="22" rx="11" fill="#E1F5EE"/>
  <text x="1096" y="245" font-size="12" fill="#085041" text-anchor="middle">③ 2~4분 뒤</text>

  <!-- 보조 설명 -->
  <g>
    <line x1="160" y1="410" x2="160" y2="440" stroke="#9FE1CB" stroke-dasharray="3 3"/>
    <rect x="64" y="440" width="192" height="92" rx="10" fill="#FFFFFF" stroke="#E1F5EE"/>
    <text x="160" y="466" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle">건너뛸 때</text>
    <text x="160" y="487" font-size="12" fill="#5F5E5A" text-anchor="middle">상한 초과 → 안내만 남김</text>
    <text x="160" y="507" font-size="12" fill="#5F5E5A" text-anchor="middle">이미 분석 → 아무것도 안 함</text>
  </g>
  <g>
    <line x1="376" y1="410" x2="376" y2="440" stroke="#9FE1CB" stroke-dasharray="3 3"/>
    <rect x="280" y="440" width="192" height="92" rx="10" fill="#FFFFFF" stroke="#E1F5EE"/>
    <text x="376" y="466" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle">Sentry REST API</text>
    <text x="376" y="487" font-size="12" fill="#5F5E5A" text-anchor="middle">사용자 정보는 id만 남김</text>
    <text x="376" y="507" font-size="12" fill="#5F5E5A" text-anchor="middle">Claude는 파일로만 받음</text>
  </g>
  <g>
    <line x1="592" y1="410" x2="592" y2="440" stroke="#9FE1CB" stroke-dasharray="3 3"/>
    <rect x="496" y="440" width="192" height="92" rx="10" fill="#FFFFFF" stroke="#E1F5EE"/>
    <text x="592" y="466" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle">이슈가 난 그 코드</text>
    <text x="592" y="487" font-size="12" fill="#5F5E5A" text-anchor="middle">웹은 릴리즈 커밋 · 셸은 main</text>
    <text x="592" y="507" font-size="12" fill="#5F5E5A" text-anchor="middle">BE · AI는 배포 태그</text>
  </g>
  <g>
    <line x1="808" y1="410" x2="808" y2="440" stroke="#F0997B" stroke-dasharray="3 3"/>
    <rect x="712" y="440" width="192" height="92" rx="10" fill="#FFFFFF" stroke="#FAECE7"/>
    <text x="808" y="466" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle">관리자 구독 토큰</text>
    <text x="808" y="487" font-size="12" fill="#5F5E5A" text-anchor="middle">API 결제 없음</text>
    <text x="808" y="507" font-size="12" fill="#5F5E5A" text-anchor="middle">도구 50번 · 12분 상한</text>
  </g>
  <g>
    <line x1="1032" y1="410" x2="1032" y2="440" stroke="#9FE1CB" stroke-dasharray="3 3"/>
    <rect x="928" y="440" width="208" height="92" rx="10" fill="#FFFFFF" stroke="#E1F5EE"/>
    <text x="1032" y="466" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle">실패해도 카드는 그대로</text>
    <text x="1032" y="487" font-size="12" fill="#5F5E5A" text-anchor="middle">스레드에 실패 안내</text>
    <text x="1032" y="507" font-size="12" fill="#5F5E5A" text-anchor="middle">결과 원문은 14일 보관</text>
  </g>

  <!-- 판정 범례 -->
  <text x="40" y="604" font-size="13" font-weight="600" fill="#2C2C2A">판정</text>
  <g font-size="13">
    <rect x="88" y="586" width="132" height="28" rx="14" fill="#FCEBEB"/>
    <text x="154" y="605" fill="#791F1F" text-anchor="middle">🚨 고쳐야 해요</text>
    <rect x="232" y="586" width="116" height="28" rx="14" fill="#FAEEDA"/>
    <text x="290" y="605" fill="#633806" text-anchor="middle">👀 지켜봐요</text>
    <rect x="360" y="586" width="156" height="28" rx="14" fill="#F1EFE8"/>
    <text x="438" y="605" fill="#444441" text-anchor="middle">🔕 괜한 알림이에요</text>
    <rect x="528" y="586" width="124" height="28" rx="14" fill="#EAF3DE"/>
    <text x="590" y="605" fill="#27500A" text-anchor="middle">✅ 문제없어요</text>
  </g>
  <text x="1160" y="605" font-size="12" fill="#888780" text-anchor="end">위로 갈수록 급해요 · 🚨 👀 🔕엔 Claude Code에서 이어 갈 프롬프트가 붙어요</text>
</svg>
